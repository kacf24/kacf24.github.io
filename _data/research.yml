- name: Seaweed Aquaculture
  topics: Data Science, Physiology, Sustainability
  region: Local
  description: The demand for seafood has has increased annually over the past few decades, creating increased pressure on wild harvested crops. To meet such a market, farmers across the country have begun to grow seaweeds for both human consumption and bioproducts. I have collaborated on seaweed farming projects in Maine and Texas and worked with both red and brown seaweeds including <i> Porphyra umbilicalis, Wildemania amplissima, Palmaria palmata, Alaria esculenta, Saccharina latissima, Ulva intestinalis, and Gracilaria tikvahiae </i>. I have worked all stages of projects including algae collection, sporulation and seeding, farm setup, nursery culturing, protocol development, harvesting and processing, and data analysis.  
  image: nursery.jpg

  

