- name: Coastal Biogeochemistry
  topics: Blue Carbon, Data Science, Nitrogen Cycling
  region: Local, Regional
  description: Coastal environmentals are hotspots are elements vital to life including carbon, nitrogen, and phospohrous. I'm deeply interested in the complex cycles of such elements in coastal environments and how "plants" interact with them. Currently, I am building budgets of organic and inorganic carbon, as well as nitrogen in sediments collected from seagrass meadows across the Western and Northern Gulf of Mexico. This effort is paired with the [Texas Seagrass Monitoring Program](https://texasseagrass.org/) and the [Coastal Ecology & Seagrass Biology Lab](https://www.darnellseagrassecologylab.com/). This will provide resource managers valuable information to ascertain sequestration potential in a rapidly changing climate. 
  image: seds.jpg 

- name: Microbial Ecology
  topics: Community Ecology, Data Science, Physiology
  region: Local, Regional, International
  description: Complex organisms have associated microbial communities that assist them in carrying out functions nessecary for survivial including vitamin production, stress protection, and pathogen defense. However, it relatively few studies on the ecology of these microoganisms exist to paralel the ecology of their hosts. I investigated microbial communties living on intertidal seaweeds with a group led by Drs. [Susan Brawley](https://scholar.google.com/citations?user=cyA5330AAAAJ&hl=en) and [Hilary Morrison](https://scholar.google.com/citations?user=-cmjxwsAAAAJ). Together, we demonstrated that bacterial communities exhibit zonatation patterns similar to <i>Fucus spp.</i> through a manipulative [transplant experiment](https://www.frontiersin.org/journals/microbiology/articles/10.3389/fmicb.2020.563118/full). Furthermore, we also found a strong a strong north-south [latitudinal gradient](https://onlinelibrary.wiley.com/doi/full/10.1111/jpy.13194) in structure of the microbiome of <i>F. vesiculosus</i> over its biogeographic range.
  image: fucus.jpg  

- name: Sustainable Aquaculture
  topics: Data Science, Physiology, Sustainability
  region: Local
  description: The demand for seafood has has increased annually over the past few decades, creating increased pressure on wild harvested crops. To meet such a market, farmers across the country have begun to grow seaweeds for both human consumption and bioproducts. I have collaborated on seaweed farming projects in Maine and Texas and worked with both red and brown seaweeds including <i> Porphyra umbilicalis, Wildemania amplissima, Palmaria palmata, Alaria esculenta, Saccharina latissima, Ulva intestinalis, and Gracilaria tikvahiae </i>. I have worked all stages of projects including algae collection, sporulation and seeding, farm setup, nursery culturing, protocol development, harvesting and processing, and data analysis.  
  image: nursery.jpg

  

