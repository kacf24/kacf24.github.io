- name: Benthic Community Monitoring
  topics: Community Ecology, Data Science, Water Quality
  region: Local, Regional
  description: |
    Monitoring benthic communities across diverse estuarine habitats is vital for understanding biodiversity patterns and ecosystem health.

    * **SAV Community Assemblages:** Characterized macroinvertebrate community assemblages across native and invasive freshwater submerged aquatic vegetation (SAV) habitats.
    * **Host-Associated Zonation:** Conducted a manipulative [transplant experiment](https://www.frontiersin.org/journals/microbiology/articles/10.3389/fmicb.2020.563118/full) across stress gradients, demonstrating that host-associated micro-communities exhibit distinct zonation patterns.
    * **Habitat Change Detection:** Developed an open-source machine learning framework for [rapid coastal habitat change detection](https://doi.org/10.1007/s12237-026-01753-y) using remotely sensed data.
  image: benthic.jpg

- name: Ecosystem Change and Resilience
  topics: Climate Change Biology, Data Science, Water Quality
  region: Local, Regional
  description: |
    Quantifying long-term ecosystem responses to environmental stressors is critical for developing effective coastal conservation and climate adaptation strategies.

    * **Thermal Stress Mitigation:** Evaluated multi-decadal water quality and aerial imaging datasets, showing that regional water quality management mitigates thermal stress on seagrasses.
    * **Sea Level Rise Impacts:** Managed Tier-2 monitoring across 800+ coastal sites with the [Texas Seagrass Monitoring Program](https://texasseagrass.org/), demonstrating that rapid [sea level rise](https://www.nature.com/articles/s43247-024-01236-7) drives significant seagrass loss in the Upper Laguna Madre.
    * **Biogeographic Drivers of Resilience:** Evaluated trans-Atlantic host-associated community variations along a [latitudinal gradient](https://onlinelibrary.wiley.com/doi/full/10.1111/jpy.13194) to uncover past and present drivers of ecosystem resilience.
  image: seagrass_monitoring.JPG

- name: Ecoacoustics
  topics: Blue Carbon, Data Science, Physiology
  region: Local, Regional
  description: |
    Ecoacoustic methodologies offer advanced non-invasive remote sensing capacity for monitoring dynamic metabolic processes and biomass in marine autotrophs.

    * **Acoustic Canopy Modeling:** Formulated a novel [effective medium model](https://pubs.aip.org/asa/poma/article/51/1/010003/3267870/Effective-medium-modeling-of-acoustic-propagation) to characterize acoustic propagation through seagrass canopies.
    * **Biomass Tracking via Inference:** Deployed active acoustic arrays and applied [Bayesian inference to track above-ground biomass](https://doi.org/10.1121/10.0041880) over annual cycles.
    * **Sub-Tropical Ecoacoustics:** Conducted a [multi-year study of acoustic propagation and ambient sound in a Thalassia testudinum seagrass meadow](https://doi.org/10.1121/10.0034243) in a shallow sub-tropical lagoon.
  image: acoustics.png

- name: Physiology and Metabolism
  topics: Photosynthesis, Stress Tolerance, Data Science, Climate Change Biology
  region: Local, Regional
  description: |
    Quantifying the physiological tolerance limits and metabolic acclimation of marine primary producers is essential for predicting autotrophic survival under accelerating climate stress.

    * **Macroalgal Stress Tolerance:** Identified high tolerance to [reactive oxygen stress](https://www.degruyter.com/document/doi/10.1515/bot-2018-0104/html) in the invasive alga *Grateloupia turuturu*, explaining its competitive success and resistance to biosecurity protocols.
    * **Desiccation & Photosynthesis:** Quantified [desiccation tolerance](https://www.biorxiv.org/content/10.1101/2024.01.16.575902v1.abstract) and photosynthetic rates in subtidal seagrasses under environmental exposure using infrared gas analysis and fluorometry.
    * **Acoustic Ebullition Monitoring:** Demonstrated that [acoustic monitoring reveals key differences in ebullition dynamics and biomass](https://doi.org/10.1007/s12237-025-01655-5) across seagrass meadows.
    * **Net Ecosystem Productivity:** Tracked photosynthetic oxygen ebullition to show how [oxygen ebullition uncovers hidden net ecosystem productivity](https://doi.org/10.34133/olar.0087) in a seemingly heterotrophic seagrass meadow.
  image: grat.jpg

- name: Coastal Biogeochemistry
  topics: Blue Carbon, Data Science, Nitrogen Cycling
  region: Local, Regional
  description: |
    Nearshore marine vegetation functions as a critical global biogeochemical sink, mediating organic matter preservation and nutrient cycles across coastal boundaries.

    * **Regional Blue Nutrient Inventory:** Constructed a regional [sediment blue carbon and nitrogen inventory](https://doi.org/10.5281/zenodo.21828401) across Western and Northern Gulf of Mexico seagrass meadows.
    * **Nutrient Reservoir Degradation:** Analyzed sedimentary core data to demonstrate that seagrass meadow loss severely degrades the long-term blue nutrient reservoir capacity of coastal sediments.
  image: seds.jpg

- name: Aquaculture and Restoration
  topics: Data Science, Physiology, Sustainability
  region: Local
  description: |
    Sustainable aquaculture and ecological restoration provide vital solutions for enhancing coastal ecosystem resilience and expanding nature-based bio-economies.

    * **Macroalgal Aquaculture & Biosecurity:** Synthesized [climate change scenario impacts on cold-water aquaculture](https://doi.org/10.1111/raq.12483), authored [biosecurity fact sheets](https://seagrant.umaine.edu/wp-content/uploads/sites/467/2019/05/2018-grateloupia-fact-sheet.pdf), and executed multi-stage hatchery protocols across seven commercial seaweed species.
    * **Seagrass Restoration:** Investigated how light exposure affects the quantity and quality of harvested eelgrass seeds to optimize restoration efforts.
  image: nursery.jpg