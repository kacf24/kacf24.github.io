# Footer info
affiliation: >
  Kyle A Capistrant-Fossa, PhD<br/>
  RAISE Postdoctoral Research Fellow<br/>
  Virginia Institute of Marine Sciences

location: >
  Virginia Institute of Marine Sciences<br/>
  1370 Greate Rd<br/>
  Gloucester Point, VA 23062

contact: >
  <a href="mailto:kacapistrantfossa@vims.edu" target="_blank"><i class="fa fa-envelope fa-1x"></i> Contact Kyle via email</a> <br/>


# Pages shown in navbar
nav_pages:
  - name: about
  - name: publications
  - name: talks
  - name: research
  - name: data
  - name: Media Coverage


include:
  - .htaccess
  - _pages

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links

plugins: ["jekyll/scholar"]

scholar:
  last_name: Capistrant-Fossa
  first_name: [Kyle]

  style: citesty
  locale: en

  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  query: "@*"

  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - update_boostrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
